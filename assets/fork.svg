<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="Farm to fork illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e7d0"/>
      <stop offset="1" stop-color="#cfd9b2"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f0ead9"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa15f"/>
      <stop offset="1" stop-color="#6f8a4f"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c703f"/>
      <stop offset="1" stop-color="#4a5d3a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6ecc9"/>
      <stop offset="1" stop-color="#efdca0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="520" fill="url(#sky)"/>
  <circle cx="640" cy="118" r="66" fill="url(#sun)"/>

  <!-- Rolling hills -->
  <path d="M0 300 Q 200 232 400 292 T 800 268 V300 Z" fill="url(#hillA)"/>
  <path d="M0 360 Q 240 300 470 358 T 800 336 V360 Z" fill="url(#hillB)"/>

  <!-- Crop rows on the far hill -->
  <g stroke="#3d4f2a" stroke-width="3" opacity="0.5" stroke-linecap="round">
    <path d="M70 288 q 6 -18 12 0"/>
    <path d="M110 292 q 6 -18 12 0"/>
    <path d="M150 290 q 6 -18 12 0"/>
    <path d="M190 294 q 6 -18 12 0"/>
    <path d="M560 280 q 6 -18 12 0"/>
    <path d="M600 284 q 6 -18 12 0"/>
    <path d="M640 282 q 6 -18 12 0"/>
  </g>

  <!-- A little tree on the hill -->
  <g transform="translate(250 244)">
    <rect x="-4" y="0" width="8" height="30" rx="3" fill="#5b4326"/>
    <circle cx="0" cy="-6" r="24" fill="#5c703f"/>
    <circle cx="-16" cy="4" r="16" fill="#6f8a4f"/>
    <circle cx="16" cy="4" r="16" fill="#6f8a4f"/>
  </g>

  <!-- Dashed "farm to fork" journey path -->
  <path d="M250 300 C 340 380, 420 300, 470 372" fill="none"
        stroke="#a8895f" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- Wooden table -->
  <rect x="0" y="392" width="800" height="128" fill="#b98a5a"/>
  <rect x="0" y="392" width="800" height="14" fill="#a8794b"/>
  <g stroke="#a8794b" stroke-width="3" opacity="0.5">
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="0" y1="484" x2="800" y2="484"/>
  </g>

  <!-- Plate -->
  <ellipse cx="430" cy="444" rx="176" ry="52" fill="rgba(60,50,30,0.18)"/>
  <ellipse cx="430" cy="434" rx="176" ry="54" fill="url(#plate)" stroke="#e3dcc8" stroke-width="3"/>
  <ellipse cx="430" cy="434" rx="126" ry="38" fill="none" stroke="#e7e0cd" stroke-width="3"/>

  <!-- Fresh food on the plate: amla berries + moringa sprig -->
  <g>
    <!-- Amla berries -->
    <circle cx="392" cy="430" r="19" fill="#9bb84e"/>
    <circle cx="386" cy="424" r="5" fill="#c3d97e" opacity="0.8"/>
    <circle cx="424" cy="440" r="16" fill="#8aa93f"/>
    <circle cx="419" cy="435" r="4" fill="#c3d97e" opacity="0.8"/>
    <!-- Moringa sprig -->
    <g transform="translate(470 418)">
      <path d="M0 26 C 6 10, 6 -4, 2 -20" fill="none" stroke="#4a5d3a" stroke-width="3" stroke-linecap="round"/>
      <g fill="#5c703f">
        <ellipse cx="-9" cy="8" rx="6" ry="4" transform="rotate(-25 -9 8)"/>
        <ellipse cx="12" cy="4" rx="6" ry="4" transform="rotate(25 12 4)"/>
        <ellipse cx="-8" cy="-6" rx="6" ry="4" transform="rotate(-25 -8 -6)"/>
        <ellipse cx="11" cy="-10" rx="6" ry="4" transform="rotate(25 11 -10)"/>
        <ellipse cx="-4" cy="-18" rx="5" ry="4" transform="rotate(-15 -4 -18)"/>
      </g>
    </g>
  </g>

  <!-- Fork (left) -->
  <g fill="#c9b48a" stroke="#a8895f" stroke-width="1.5">
    <rect x="214" y="418" width="9" height="70" rx="4"/>
    <rect x="204" y="384" width="4" height="30" rx="2"/>
    <rect x="212" y="380" width="4" height="34" rx="2"/>
    <rect x="220" y="380" width="4" height="34" rx="2"/>
    <rect x="228" y="384" width="4" height="30" rx="2"/>
    <path d="M204 410 q 14 12 28 0 v6 q -14 10 -28 0 z"/>
  </g>

  <!-- Knife (right) -->
  <g fill="#c9b48a" stroke="#a8895f" stroke-width="1.5">
    <rect x="632" y="420" width="9" height="66" rx="4"/>
    <path d="M628 384 q 18 6 18 34 h -18 z"/>
  </g>
</svg>
